name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0
      - name: Run unit tests, lint and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lizs-Shopping-List-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android13-journey:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Enable KVM for ephemeral emulator
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0
      - name: Test shopping journey on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android13-journey-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
